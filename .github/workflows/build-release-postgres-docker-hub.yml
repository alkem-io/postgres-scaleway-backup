name: Release Postgres backup image to DockerHub

# Builds Dockerfile-Postgres and pushes alkemio/postgres-scaleway-backup:<tag>.
# Publish a release (the release tag becomes the image tag), or run it by hand with a tag.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to push, for example v1.0.3"
        required: true
        type: string

env:
  IMAGE: alkemio/postgres-scaleway-backup
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check the tag
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$TAG' is not of the form v1.2.3"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Refuse to overwrite a published tag
        run: |
          if docker buildx imagetools inspect "$IMAGE:$TAG" > /dev/null 2>&1; then
            echo "::error::$IMAGE:$TAG already exists. Running jobs pin tags, so pick a new one."
            exit 1
          fi

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile-Postgres
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          cache-to: type=gha,mode=max
          cache-from: type=gha
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.TAG }}

      - name: Check the tools in the image
        run: |
          want=$(sed -n 's/^ARG POSTGRES_VERSION=//p' Dockerfile-Postgres)
          got=$(docker run --rm "$IMAGE:$TAG" pg_dump --version)
          echo "$got"
          case "$got" in
            *" $want "*|*" $want") ;;
            *) echo "::error::pg_dump is not $want"; exit 1 ;;
          esac
          docker run --rm "$IMAGE:$TAG" sh -ec 'psql --version; pg_restore --version; aws --version; s3cmd --version; age --version; kubectl version --client; gzip --version | head -1'

      # Same inputs as the build above, so this pushes the image that was just checked.
      - name: Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile-Postgres
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          cache-from: type=gha
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.TAG }}
